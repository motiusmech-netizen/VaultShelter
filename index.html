<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>АтомУют: Убежище</title>
    <style>
      html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e12;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#1b2430 0%,#0b0e12 70%);color:#f3e9d2;font:600 14px/1.3 system-ui,sans-serif;z-index:100;transition:opacity .5s}
      #boot .ring{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,176,46,.18);border-top-color:#ffb02e;animation:spin 1s linear infinite}
      #boot .bar{width:220px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
      #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb02e,#ffd27a);transition:width .3s}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div><div class="bar"><i id="bootbar"></i></div></div>
    <canvas id="world"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
